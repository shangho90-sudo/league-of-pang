name: Deploy web game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: npx esbuild src/main.js --bundle --format=esm --minify --outfile=dist/main.js
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css dist public _site/
          # 캐시 무효화: 배포마다 게임 파일 주소에 커밋 버전을 붙여 브라우저가 이전 파일을 쓰지 않게 함
          V=${GITHUB_SHA::7}
          sed -i "s#src=\"dist/main.js\"#src=\"dist/main.js?v=$V\"#; s#href=\"style.css\"#href=\"style.css?v=$V\"#" _site/index.html
          grep -n "?v=" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
